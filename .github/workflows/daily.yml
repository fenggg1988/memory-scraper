name: Daily Memory Price Scrape

on:
  schedule:
    # 10:00 Beijing time (UTC+8) == 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scraper (downloads RamRadar CSV, no browser needed)
        run: node scraper.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ram_prices.csv docs/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily memory price update $(date -u +%F)"
            git push
          fi
