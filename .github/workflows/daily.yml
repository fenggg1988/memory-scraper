# schedule re-registered 2026-09-26 (fix: cron lost after account flag)
name: Daily Memory Price Scrape

on:
  schedule:
    # 10:00 Beijing time (UTC+8) == 02:00 UTC
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "内部使用：链式调度传来的标记，勿手动填写"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scraper (downloads RamRadar CSV, no browser needed)
        run: node scraper.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ram_prices.csv data/hbm_prices.csv docs/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily memory price update $(date -u +%F)"
            git pull --rebase --autostash origin "$(git branch --show-current)" || true
            git push
          fi

      # 兜底：schedule 不可靠（GitHub 免费版常延迟数小时）。
      # 注意：GITHUB_TOKEN 无法触发 workflow_dispatch（防递归），必须用 PAT(CHAIN_TOKEN)。
      # 每次成功运行后主动触发下一个项目，形成自链式调度。
      - name: Trigger next project (chain)
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CHAIN_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/gpu-price-tracker/actions/workflows/daily.yml/dispatches \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true
