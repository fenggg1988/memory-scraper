<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAM 内存现货价格追踪</title>
<style>
  :root { --bg: #f5f6fa; --card: #fff; --text: #2c3e50; --muted: #7f8c8d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header { text-align: center; padding: 30px 0 10px; }
  header h1 { font-size: 28px; font-weight: 700; }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { flex: 1; min-width: 120px; background: var(--card); padding: 16px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; color: #2c3e50; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card { background: var(--card); border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #e74c3c; }
  .report { padding: 16px 0; border-bottom: 1px solid #eee; }
  .report:last-child { border-bottom: none; }
  .report-date { font-size: 13px; color: var(--muted); font-weight: 500; }
  .report-title { font-size: 16px; font-weight: 700; margin: 4px 0 8px; color: #2c3e50; }
  .report-body { font-size: 14px; color: #555; line-height: 1.8; }
  .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  .footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DRAM 内存现货价格追踪</h1>
    <p>数据来源：TrendForce 集邦咨询 (via bomman.com) | 每周自动更新</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2><span class="dot"></span> 现货市场报告</h2>
    <div id="report-list"></div>
  </div>

  <div class="footer">
    最后更新: <span id="last-update">-</span> &nbsp;|&nbsp;
    数据仅供参考，不构成投资建议
  </div>
</div>

<script>
(async () => {
  let reports = [];
  try {
    const r = await fetch("bomman_prices.json");
    if (r.ok) reports = await r.json();
  } catch (e) {}

  document.getElementById("last-update").textContent =
    new Date().toISOString().slice(0, 10);

  // 统计
  if (reports.length > 0) {
    const last = reports[reports.length - 1];
    document.getElementById("stats").innerHTML = [
      `<div class="stat"><div class="val">${last.date}</div><div class="lbl">最新报告日期</div></div>`,
      `<div class="stat"><div class="val">${reports.length}</div><div class="lbl">累计报告数</div></div>`,
    ].join("");
  }

  // 报告列表
  const list = document.getElementById("report-list");
  if (reports.length > 0) {
    list.innerHTML = reports.reverse().map(r => `
      <div class="report">
        <div class="report-date">${r.date}</div>
        <div class="report-title">${r.title}</div>
        <div class="report-body">${r.summary}</div>
      </div>
    `).join("");
  } else {
    list.innerHTML = "<p style='color:#999;text-align:center;padding:20px;'>报告将在首次数据抓取后展示</p>";
  }
})();
</script>
</body>
</html>
